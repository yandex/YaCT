[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yact"
version = "0.1.0"
description = "YaCT — Yet Another Closed-loop Teleoperation for Unitree G1"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
    "AUTHORS",
    "LICENSE",
    "NOTICES",
    "THIRD_PARTY_LICENSES/*.txt",
]
dependencies = [
    "pyyaml",
    "paramiko",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
yact = "lib.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.setuptools.package-data]
"lib.deploy.configs" = ["*.yaml"]
